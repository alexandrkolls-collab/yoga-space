<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga Space Baryshivka</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #F8F6F2;
      color: #29221D;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    /* Сховати скроллбар для графіка */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

  <!-- Фоновий лотос -->
  <svg class="absolute top-[-5%] left-[-10%] w-[120%] opacity-5 pointer-events-none z-0" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="#29221D" d="M41.7,-64.3C53.3,-55.8,61.4,-42.6,67.6,-28.5C73.9,-14.5,78.3,0.3,75.4,14.1C72.6,27.9,62.4,40.7,50.1,51C37.8,61.3,23.3,69.2,7.3,71.2C-8.7,73.2,-26.1,69.2,-41.2,60.2C-56.3,51.1,-69,37.1,-75.6,20.4C-82.2,3.7,-82.7,-15.8,-75.4,-31.8C-68,-47.9,-52.8,-60.5,-37.2,-67.7C-21.6,-74.9,-5.6,-76.8,9.4,-72C24.4,-67.1,41.7,-64.3,41.7,-64.3Z" transform="translate(100 100)" />
  </svg>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_PIN = '1234'; 
    const TELEGRAM_BOT_TOKEN = '8681415848:AAE4GQINEMMcU5usUAItyxfz766iROh4vcE';
    const TELEGRAM_CHAT_ID = '724872162';

    const SUPABASE_URL = 'https://fbmkawjfoqhbcblitoma.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JJv5HkOiwzCVsqTVrXU7Gg_l-vGJqD4';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const TARGET_DAYS = [1, 3, 5];
    const HOUR_START = 20;
    const MINUTE_START = 15;

    const getUpcomingTrainings = () => {
      const now = new Date();
      const trainings = [];

      TARGET_DAYS.forEach(targetDay => {
        let date = new Date(now);
        const day = date.getDay();
        
        let diff = targetDay - day;
        if (diff < 0) diff += 7; 
        
        if (diff === 0) {
          if (now.getHours() > HOUR_START || (now.getHours() === HOUR_START && now.getMinutes() >= MINUTE_START)) {
            diff += 7;
          }
        }

        date.setDate(date.getDate() + diff);
        date.setHours(0, 0, 0, 0);

        const dayName = targetDay === 1 ? 'Понеділок' : targetDay === 3 ? 'Середа' : "П'ятниця";
        const formattedDate = date.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });
        const id = `t_${date.getFullYear()}-${String(date.getMonth()+1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

        trainings.push({
          id: id,
          day: dayName,
          date: formattedDate,
          fullDate: date,
          time: '20:15',
          maxCapacity: 10
        });
      });

      return trainings.sort((a, b) => a.fullDate - b.fullDate);
    };

    const normalizeContact = (str) => {
      if (!str) return '';
      return str.toLowerCase().replace(/[\s\+\-\(\)@]/g, '');
    };

    const sendTelegramNotification = async (text) => {
      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text, parse_mode: 'HTML' })
        });
      } catch (error) {
        console.error('Telegram Error:', error);
      }
    };

    function App() {
      const [bookings, setBookings] = useState([]);
      const [allBookings, setAllBookings] = useState([]); 
      const [trainings, setTrainings] = useState([]);
      
      const [activeTab, setActiveTab] = useState('client'); 
      const [adminTab, setAdminTab] = useState('groups'); 
      
      const [bookingModal, setBookingModal] = useState(null); 
      const [rescheduleModal, setRescheduleModal] = useState(null); 
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const [formData, setFormData] = useState({ 
        name: '', phone: '', instagram: '', needReminder: true, reminderTime: '3h'
      });
      const [personsCount, setPersonsCount] = useState(1);
      const [contactError, setContactError] = useState(false);
      const [userSearchQuery, setUserSearchQuery] = useState('');

      useEffect(() => {
        setTrainings(getUpcomingTrainings());
        fetchBookings();

        if (supabase) {
          const channel = supabase
            .channel('public:bookings')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => {
              fetchBookings();
              if (isAdminLoggedIn) fetchAllBookings();
            })
            .subscribe();

          return () => supabase.removeChannel(channel);
        }
      }, []);

      useEffect(() => {
        if (isAdminLoggedIn) {
          fetchAllBookings();
        }
      }, [isAdminLoggedIn]);

      const fetchBookings = async () => {
        if (!supabase || SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          const local = localStorage.getItem('yoga_baryshivka_db_bookings');
          setBookings(local ? JSON.parse(local) : []);
          return;
        }

        const currentTrainingIds = getUpcomingTrainings().map(t => t.id);
        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .in('training_id', currentTrainingIds);

        if (!error && data) {
          setBookings(data);
          localStorage.setItem('yoga_baryshivka_db_bookings', JSON.stringify(data));
        }
      };

      const fetchAllBookings = async () => {
        if (!supabase || SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          const local = localStorage.getItem('yoga_baryshivka_db_bookings');
          setAllBookings(local ? JSON.parse(local) : []);
          return;
        }

        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data) {
          setAllBookings(data);
        }
      };

      const getBookedCount = (trainingId) => {
        return bookings
          .filter(b => b.training_id === trainingId)
          .reduce((sum, b) => sum + (b.persons_count || 1), 0);
      };

      const getAnalytics = () => {
        let totalRevenue = 0;
        let totalPersons = 0;
        let totalBookings = allBookings.length;

        const chartDataMap = {};

        allBookings.forEach(b => {
          const pCount = b.persons_count || 1;
          const price = b.type === 'trial' ? 150 : 200;
          
          totalPersons += pCount;
          totalRevenue += (price * pCount);

          const tId = b.training_id;
          let shortDate = tId.startsWith('t_') ? tId.substring(7) : 'Старі';
          
          if (!chartDataMap[shortDate]) chartDataMap[shortDate] = 0;
          chartDataMap[shortDate] += pCount;
        });

        const chartData = Object.keys(chartDataMap)
          .map(k => ({ label: k, count: chartDataMap[k] }))
          .sort((a, b) => a.label.localeCompare(b.label))
          .slice(-12); 

        const maxChartValue = Math.max(10, ...chartData.map(d => d.count));

        return { totalRevenue, totalPersons, totalBookings, chartData, maxChartValue };
      };

      // ФУНКЦІЯ ОЧИЩЕННЯ БАЗИ
      const handleClearHistory = async () => {
        const pass = prompt('УВАГА! Це видалить абсолютно всі записи з бази без можливості відновлення.\n\nВведіть ПІН-код для підтвердження:');
        
        if (pass !== ADMIN_PIN) {
          if (pass !== null) alert('Невірний ПІН-код! Очищення скасовано.');
          return;
        }
        
        if (!confirm('Ви абсолютно впевнені? Цю дію неможливо скасувати!')) return;

        if (supabase && !SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          // Видаляємо всі рядки, де id не пустий
          await supabase.from('bookings').delete().neq('id', '0');
        } 
        
        setBookings([]);
        setAllBookings([]);
        localStorage.removeItem('yoga_baryshivka_db_bookings');
        alert('Історію бази даних успішно очищено!');
      };

      const handleBooking = async (e) => {
        e.preventDefault();
        const phoneClean = formData.phone.trim();
        const instaClean = formData.instagram.trim();
        
        if (!phoneClean && !instaClean) {
          setContactError(true);
          return;
        }

        const pricePerPerson = bookingModal.type === 'trial' ? 150 : 200;
        const totalPrice = pricePerPerson * personsCount;

        const newBooking = {
          id: 'b_' + Date.now(),
          training_id: bookingModal.training.id,
          name: formData.name,
          phone: phoneClean,
          instagram: instaClean,
          type: bookingModal.type,
          persons_count: personsCount,
          need_reminder: formData.needReminder,
          reminder_time: formData.needReminder ? formData.reminderTime : null
        };

        if (supabase && !SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          await supabase.from('bookings').insert([newBooking]);
        } else {
          const updated = [...bookings, newBooking];
          setBookings(updated);
          localStorage.setItem('yoga_baryshivka_db_bookings', JSON.stringify(updated));
        }

        localStorage.setItem('yoga_user_contact', phoneClean || instaClean);

        const messageText = `🧘 <b>НОВИЙ ЗАПИС НА ЙОГУ!</b>\n\n` +
          `📅 <b>День:</b> ${bookingModal.training.day}, ${bookingModal.training.date}\n` +
          `👤 <b>Ім'я:</b> ${formData.name}\n` +
          `👥 <b>Кількість:</b> ${personsCount} осіб\n` +
          `🎟️ <b>Тип:</b> ${bookingModal.type === 'trial' ? 'Пробне (150₴)' : 'Повторне (200₴)'}\n` +
          `💰 <b>Сума:</b> ${totalPrice}₴\n\n` +
          `📞 <b>Телефон:</b> ${phoneClean || 'Не вказано'}\n` +
          `📸 <b>Instagram:</b> ${instaClean ? '@' + instaClean.replace('@', '') : 'Не вказано'}\n` +
          `🔔 <b>Нагадування:</b> ${formData.needReminder ? (formData.reminderTime === '1d' ? 'За 1 день' : 'За 3 години') : 'Ні'}`;

        sendTelegramNotification(messageText);
        
        setFormData({ name: '', phone: '', instagram: '', needReminder: true, reminderTime: '3h' });
        setPersonsCount(1);
        setBookingModal(null);
        setContactError(false);
        alert(`Дякуємо! Ви успішно записані (${personsCount} осіб) 🙏`);
      };

      const handleCancelBooking = async (bookingId) => {
        if (!confirm('Ви дійсно бажаєте скасувати цей запис?')) return;

        const cancelledBooking = bookings.find(b => b.id === bookingId) || allBookings.find(b => b.id === bookingId);
        const trainingInfo = trainings.find(t => t.id === cancelledBooking?.training_id);

        if (supabase && !SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          await supabase.from('bookings').delete().eq('id', bookingId);
        } else {
          const updated = bookings.filter(b => b.id !== bookingId);
          setBookings(updated);
          setAllBookings(allBookings.filter(b => b.id !== bookingId));
          localStorage.setItem('yoga_baryshivka_db_bookings', JSON.stringify(updated));
        }

        if (cancelledBooking && trainingInfo) {
          const cancelMessage = `❌ <b>СКАСУВАННЯ ЗАПИСУ!</b>\n\n` +
            `📅 <b>День:</b> ${trainingInfo.day}, ${trainingInfo.date}\n` +
            `👤 <b>Клієнт:</b> ${cancelledBooking.name} (${cancelledBooking.persons_count || 1} осіб)\n` +
            `📞 <b>Контакт:</b> ${cancelledBooking.phone || '@' + cancelledBooking.instagram}`;
          sendTelegramNotification(cancelMessage);
        }
      };

      const handleReschedule = async (targetTrainingId) => {
        const { currentTrainingId, booking } = rescheduleModal;
        if (currentTrainingId === targetTrainingId) return;

        const oldTraining = trainings.find(t => t.id === currentTrainingId);
        const newTraining = trainings.find(t => t.id === targetTrainingId);

        if (supabase && !SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT')) {
          await supabase.from('bookings').update({ training_id: targetTrainingId }).eq('id', booking.id);
        } else {
          const updated = bookings.map(b => b.id === booking.id ? { ...b, training_id: targetTrainingId } : b);
          setBookings(updated);
          localStorage.setItem('yoga_baryshivka_db_bookings', JSON.stringify(updated));
        }

        const rescheduleMessage = `🔄 <b>ПЕРЕНОС ЗАПИСУ!</b>\n\n` +
          `👤 <b>Клієнт:</b> ${booking.name} (${booking.persons_count || 1} осіб)\n` +
          `❌ <b>З дати:</b> ${oldTraining?.day}, ${oldTraining?.date}\n` +
          `✅ <b>На дату:</b> ${newTraining?.day}, ${newTraining?.date}\n` +
          `📞 <b>Контакт:</b> ${booking.phone || '@' + booking.instagram}`;

        sendTelegramNotification(rescheduleMessage);
        setRescheduleModal(null);
        alert('Запис успішно перенесено!');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (pinInput === ADMIN_PIN) {
          setIsAdminLoggedIn(true);
          setPinError(false);
          setPinInput('');
        } else {
          setPinError(true);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 sm:p-6">
          
          <header className="mb-6 text-center mt-2">
            <h1 className="text-4xl sm:text-5xl font-serif-title font-bold text-stone-900 mb-1 tracking-widest uppercase">ЙОГА</h1>
            <p className="text-xs tracking-widest text-stone-600 uppercase font-bold">Yoga Space Baryshivka</p>
            
            <nav className="flex justify-center gap-4 sm:gap-6 mt-5 border-b border-stone-300 pb-3 text-xs font-bold uppercase tracking-wider">
              <button 
                onClick={() => setActiveTab('client')} 
                className={activeTab === 'client' ? 'text-stone-950 border-b-2 border-stone-900 pb-1' : 'text-stone-400 hover:text-stone-700'}
              >
                Розклад
              </button>

              <button 
                onClick={() => {
                  setActiveTab('my-bookings');
                  const savedContact = localStorage.getItem('yoga_user_contact');
                  if (savedContact) setUserSearchQuery(savedContact);
                }} 
                className={activeTab === 'my-bookings' ? 'text-stone-950 border-b-2 border-stone-900 pb-1' : 'text-stone-400 hover:text-stone-700'}
              >
                Мої записи
              </button>

              <button 
                onClick={() => setActiveTab('admin')} 
                className={activeTab === 'admin' ? 'text-stone-950 border-b-2 border-stone-900 pb-1' : 'text-stone-400 hover:text-stone-700'}
              >
                Адмінка
              </button>
            </nav>
          </header>

          <main className="flex-1">
            
            {/* ВІДКРИТА ЧАСТИНА ДЛЯ КЛІЄНТІВ */}
            {activeTab === 'client' && (
              <div className="space-y-6">
                
                <div className="bg-stone-100/90 p-5 rounded-2xl border border-stone-300 text-center space-y-3 shadow-sm">
                  <div>
                    <p className="text-[11px] uppercase tracking-widest text-stone-500 font-bold mb-0.5">Стиль</p>
                    <p className="font-serif-title text-xl font-bold text-stone-900">Хатха-йога</p>
                  </div>
                  <div className="w-12 h-px bg-stone-300 mx-auto"></div>
                  <div>
                    <p className="text-sm font-bold text-stone-800">Тривалість: 45-50 хв</p>
                    <p className="text-xs font-medium text-stone-600 mt-0.5">Понеділок, Середа, П'ятниця о 20:15</p>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-stone-200 shadow-inner flex items-center justify-center gap-2">
                    <span className="text-sm text-stone-900 font-serif-title italic font-medium">
                      Після кожного заняття на вас чекає чайна церемонія
                    </span>
                    <div className="flex items-center gap-1.5 text-amber-900">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"></path>
                      </svg>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h2 className="text-center font-serif-title text-2xl font-bold text-stone-900 mb-2">Розклад та Запис</h2>
                  
                  {trainings.map(t => {
                    const bookedCount = getBookedCount(t.id);
                    const freeSlots = t.maxCapacity - bookedCount;
                    const isFull = freeSlots <= 0;
                    const fillPercentage = Math.min(100, (bookedCount / t.maxCapacity) * 100);

                    return (
                      <div key={t.id} className="bg-white border border-stone-300 rounded-2xl p-5 shadow-sm relative overflow-hidden">
                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-stone-800"></div>
                        
                        <div className="flex justify-between items-center mb-1">
                          <div>
                            <h3 className="font-serif-title text-2xl font-bold text-stone-900">{t.day}</h3>
                            <p className="text-[11px] font-bold text-stone-400 uppercase tracking-wider mt-0.5">{t.date}</p>
                          </div>
                          <div className="text-right">
                            <span className="text-2xl font-bold text-stone-800">{t.time}</span>
                          </div>
                        </div>

                        {/* НАОЧНИЙ ПРОГРЕС-БАР МІСЦЬ */}
                        <div className="mt-4 mb-5 bg-stone-50 p-3 rounded-xl border border-stone-200">
                          <div className="flex justify-between items-center text-xs mb-2 font-bold">
                            <span className="text-stone-600 uppercase tracking-wide text-[10px]">Заповненість:</span>
                            <span className={isFull ? "text-red-600" : (freeSlots <= 3 ? "text-amber-600" : "text-stone-900")}>
                              {isFull ? 'Група заповнена' : `Вільних місць: ${freeSlots} з ${t.maxCapacity}`}
                            </span>
                          </div>
                          
                          <div className="w-full bg-stone-200 rounded-full h-2 overflow-hidden flex">
                            <div 
                              className={`h-full rounded-full transition-all duration-500 ${isFull ? 'bg-red-500' : (freeSlots <= 3 ? 'bg-amber-500' : 'bg-stone-800')}`} 
                              style={{ width: `${fillPercentage}%` }}
                            ></div>
                          </div>
                          
                          {freeSlots > 0 && freeSlots <= 3 && (
                            <p className="text-[10px] font-bold text-amber-600 mt-2 text-center animate-pulse">🔥 Залишилося мало місць, встигніть записатися!</p>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2 mt-2">
                          <button
                            disabled={isFull}
                            onClick={() => { setPersonsCount(1); setBookingModal({ training: t, type: 'trial' }); }}
                            className={`py-3 px-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all text-center ${
                              isFull 
                                ? 'bg-stone-100 text-stone-400 border border-stone-200 cursor-not-allowed' 
                                : 'bg-amber-100 text-amber-950 border border-amber-300 hover:bg-amber-200 active:scale-[0.98]'
                            }`}
                          >
                            Пробне (150₴)
                          </button>

                          <button
                            disabled={isFull}
                            onClick={() => { setPersonsCount(1); setBookingModal({ training: t, type: 'regular' }); }}
                            className={`py-3 px-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all text-center shadow-sm ${
                              isFull 
                                ? 'bg-stone-100 text-stone-400 border border-stone-200 cursor-not-allowed' 
                                : 'bg-stone-800 text-white hover:bg-stone-900 active:scale-[0.98]'
                            }`}
                          >
                            Повторне (200₴)
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
                
                <div className="text-center text-xs text-stone-600 mt-8 pt-6 border-t border-stone-300">
                  <p className="font-bold text-stone-900 mb-0.5">Адреса проведення:</p>
                  <p className="font-medium">Баришівка, вул. Центральна 2а, 3 поверх</p>
                </div>
              </div>
            )}

            {/* --- ПОШУК СВОЇХ ЗАПИСІВ --- */}
            {activeTab === 'my-bookings' && (
              <div className="space-y-4">
                <div className="bg-white p-5 rounded-2xl border border-stone-300 shadow-sm">
                  <h3 className="font-serif-title text-xl font-bold text-stone-900 mb-1">Пошук ваших записів</h3>
                  <p className="text-xs text-stone-600 mb-3">Введіть ваш повний телефон або нікнейм Instagram:</p>
                  
                  <input
                    type="text"
                    placeholder="Напр. +380971234567 або username"
                    value={userSearchQuery}
                    onChange={(e) => setUserSearchQuery(e.target.value)}
                    className="w-full bg-stone-50 border-2 border-stone-200 text-stone-900 font-semibold rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-stone-800"
                  />
                </div>

                <h3 className="font-serif-title text-lg font-bold text-stone-900 mt-6">Знайдені записи:</h3>

                {(() => {
                  const queryNorm = normalizeContact(userSearchQuery);

                  if (queryNorm.length < 5) {
                    return <p className="text-xs text-stone-500 text-center py-6 italic">Введіть повний номер телефону або Instagram (мінімум 5 символів).</p>;
                  }

                  const foundBookings = bookings.filter(b => {
                    const phoneNorm = normalizeContact(b.phone);
                    const instaNorm = normalizeContact(b.instagram);

                    const matchPhone = phoneNorm && (
                      phoneNorm === queryNorm || 
                      (phoneNorm.endsWith(queryNorm) && queryNorm.length >= 9) ||
                      (queryNorm.endsWith(phoneNorm) && phoneNorm.length >= 9)
                    );
                    const matchInsta = instaNorm && (instaNorm === queryNorm);

                    return matchPhone || matchInsta;
                  });

                  if (foundBookings.length === 0) {
                    return <p className="text-xs text-stone-500 text-center py-6 italic">Записів за цим контактом не знайдено.</p>;
                  }

                  return (
                    <div className="space-y-3">
                      {foundBookings.map(b => {
                        const training = trainings.find(t => t.id === b.training_id);
                        if (!training) return null;

                        return (
                          <div key={b.id} className="bg-white border border-stone-300 rounded-2xl p-4 shadow-sm">
                            <div className="flex justify-between items-start mb-2 pb-2 border-b border-stone-200">
                              <div>
                                <span className="text-xs font-bold text-amber-900 uppercase">{training.day} • {training.date}</span>
                                <h4 className="font-bold text-stone-900 text-base">{b.name}</h4>
                              </div>
                              <span className="text-xs font-bold bg-stone-100 text-stone-800 px-2.5 py-1 rounded-lg">
                                👥 {b.persons_count || 1} осіб
                              </span>
                            </div>

                            {b.need_reminder && (
                              <p className="text-[11px] font-bold text-stone-600 mb-3 flex items-center gap-1">
                                <span>🔔 Нагадування:</span>
                                <span className="text-amber-900">{b.reminder_time === '1d' ? 'За 1 день' : 'За 3 години'}</span>
                              </p>
                            )}

                            <div className="flex gap-2 pt-1">
                              <button
                                onClick={() => setRescheduleModal({ currentTrainingId: b.training_id, booking: b })}
                                className="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-900 text-xs font-bold rounded-xl border border-stone-300 transition-all"
                              >
                                🔄 Перенести
                              </button>

                              <button
                                onClick={() => handleCancelBooking(b.id)}
                                className="flex-1 py-2.5 bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold rounded-xl border border-red-200 transition-all"
                              >
                                ✕ Скасувати
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            )}

            {/* --- АДМІНКА --- */}
            {activeTab === 'admin' && (
              <div>
                {!isAdminLoggedIn ? (
                  <div className="bg-white border border-stone-300 rounded-2xl p-6 text-center shadow-sm">
                    <h2 className="font-serif-title text-2xl font-bold text-stone-900 mb-2">Вхід в Адмінку</h2>
                    <p className="text-xs text-stone-600 mb-4">Введіть ПИН-код адміністратора:</p>
                    
                    <form onSubmit={handleAdminLogin} className="space-y-3">
                      <input
                        type="password"
                        placeholder="ПИН-код"
                        value={pinInput}
                        onChange={(e) => setPinInput(e.target.value)}
                        className="w-full bg-stone-50 border-2 border-stone-200 text-center font-bold text-lg rounded-xl px-4 py-2.5 text-stone-900 focus:outline-none focus:border-stone-800"
                      />
                      {pinError && <p className="text-xs font-bold text-red-600">Невірний ПИН-код!</p>}
                      
                      <button
                        type="submit"
                        className="w-full py-3 bg-stone-900 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-stone-950"
                      >
                        Увійти
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-4">
                    
                    <div className="flex justify-between items-center mb-1">
                      <h2 className="font-serif-title text-2xl font-bold text-stone-900">Кабінет</h2>
                      <button 
                        onClick={() => setIsAdminLoggedIn(false)}
                        className="text-xs text-stone-500 underline hover:text-stone-900"
                      >
                        Вийти
                      </button>
                    </div>

                    {/* Підменю адмінки */}
                    <div className="flex bg-stone-200/60 p-1 rounded-xl mb-4">
                      <button 
                        onClick={() => setAdminTab('groups')}
                        className={`flex-1 text-xs font-bold py-2 rounded-lg transition-all ${adminTab === 'groups' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}
                      >
                        Групи (Актуальні)
                      </button>
                      <button 
                        onClick={() => setAdminTab('analytics')}
                        className={`flex-1 text-xs font-bold py-2 rounded-lg transition-all ${adminTab === 'analytics' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500 hover:text-stone-700'}`}
                      >
                        Аналітика
                      </button>
                    </div>

                    {/* Вкладка ГРУПИ */}
                    {adminTab === 'groups' && trainings.map(t => {
                      const groupBookings = bookings.filter(b => b.training_id === t.id);
                      const bookedCount = getBookedCount(t.id);

                      return (
                        <div key={t.id} className="bg-white border border-stone-300 rounded-2xl p-4 shadow-sm">
                          <div className="flex justify-between items-center mb-3 pb-2 border-b border-stone-200">
                            <div>
                              <h3 className="font-bold text-stone-900">{t.day} ({t.time})</h3>
                              <p className="text-[11px] font-bold text-stone-500 uppercase">{t.date}</p>
                              <p className="text-xs font-medium text-amber-900 mt-1">Зайнято місць: {bookedCount} з {t.maxCapacity}</p>
                            </div>
                          </div>

                          {groupBookings.length === 0 ? (
                            <p className="text-xs text-stone-400 py-2 text-center italic">Записів ще немає</p>
                          ) : (
                            <div className="space-y-2">
                              {groupBookings.map((b, idx) => (
                                <div key={b.id} className="flex items-center justify-between bg-stone-50 p-3 rounded-xl border border-stone-200">
                                  <div className="flex-1">
                                    <div className="flex items-center gap-1.5 flex-wrap">
                                      <span className="text-xs font-bold text-stone-400">{idx + 1}.</span>
                                      <p className="font-bold text-sm text-stone-900">{b.name}</p>
                                      
                                      {(b.persons_count || 1) > 1 && (
                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-stone-800 text-white">
                                          👥 {b.persons_count} осіб
                                        </span>
                                      )}

                                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md uppercase ${b.type === 'trial' ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-stone-200 text-stone-800'}`}>
                                        {b.type === 'trial' ? 'Пробне' : 'Повторне'}
                                      </span>

                                      {b.need_reminder && (
                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-50 text-amber-900 border border-amber-200">
                                          🔔 {b.reminder_time === '1d' ? 'За 1 день' : 'За 3 год'}
                                        </span>
                                      )}
                                    </div>
                                    <div className="text-xs text-stone-700 font-medium mt-1.5 flex flex-col gap-0.5 pl-4">
                                      {b.phone && <span>📞 {b.phone}</span>}
                                      {b.instagram && <span>📸 @{b.instagram.replace('@', '')}</span>}
                                    </div>
                                  </div>
                                  <button
                                    onClick={() => handleCancelBooking(b.id)}
                                    className="text-red-600 hover:text-red-800 p-2 text-xs font-bold ml-2"
                                    title="Видалити"
                                  >
                                    ✕
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}

                    {/* Вкладка АНАЛІТИКА */}
                    {adminTab === 'analytics' && (() => {
                      const { totalRevenue, totalPersons, totalBookings, chartData, maxChartValue } = getAnalytics();

                      return (
                        <div className="space-y-4">
                          
                          {/* KPI Картки */}
                          <div className="grid grid-cols-2 gap-3">
                            <div className="bg-stone-900 text-white p-4 rounded-2xl shadow-md col-span-2">
                              <p className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-1">Загальний дохід</p>
                              <p className="text-3xl font-serif-title">{totalRevenue} ₴</p>
                            </div>
                            <div className="bg-white border border-stone-300 p-4 rounded-2xl shadow-sm">
                              <p className="text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Всього людей</p>
                              <p className="text-xl font-bold text-stone-900">{totalPersons}</p>
                            </div>
                            <div className="bg-white border border-stone-300 p-4 rounded-2xl shadow-sm">
                              <p className="text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Всього заявок</p>
                              <p className="text-xl font-bold text-stone-900">{totalBookings}</p>
                            </div>
                          </div>

                          {/* Графік відвідуваності */}
                          <div className="bg-white border border-stone-300 p-4 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-sm text-stone-900 mb-4">Динаміка заповненості (останні дати)</h3>
                            
                            {chartData.length === 0 ? (
                              <p className="text-xs text-stone-400 text-center italic py-4">Ще немає достатньо даних</p>
                            ) : (
                              <div className="flex items-end gap-3 h-32 overflow-x-auto no-scrollbar pt-2 pb-1">
                                {chartData.map((d, i) => (
                                  <div key={i} className="flex flex-col items-center justify-end h-full min-w-[32px] group relative">
                                    <div className="absolute -top-7 bg-stone-800 text-white text-[10px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                                      {d.count} осіб
                                    </div>
                                    <div 
                                      className="w-full bg-amber-900/80 rounded-t-md hover:bg-amber-900 transition-all" 
                                      style={{ height: `${Math.max(10, (d.count / maxChartValue) * 100)}%` }}
                                    ></div>
                                    <span className="text-[9px] font-bold text-stone-500 mt-2 rotate-45 origin-left w-6">{d.label}</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>

                          {/* Історія записів */}
                          <div className="bg-white border border-stone-300 p-4 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-sm text-stone-900 mb-3">Історія записів (всі)</h3>
                            
                            <div className="space-y-2 max-h-[400px] overflow-y-auto no-scrollbar pr-1">
                              {allBookings.map((b, i) => {
                                const createDate = b.created_at ? new Date(b.created_at).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '';
                                
                                return (
                                  <div key={b.id || i} className="flex items-center justify-between bg-stone-50 p-2.5 rounded-xl border border-stone-200">
                                    <div>
                                      <p className="font-bold text-xs text-stone-900">{b.name} <span className="text-[10px] text-stone-500 font-normal">({createDate})</span></p>
                                      <p className="text-[10px] text-stone-600 mt-0.5">{b.phone || `@${b.instagram}`}</p>
                                    </div>
                                    <div className="text-right">
                                      <p className="text-xs font-bold text-stone-800">{b.persons_count || 1} ос.</p>
                                      <p className={`text-[9px] font-bold px-1.5 py-0.5 rounded mt-1 inline-block ${b.type === 'trial' ? 'bg-amber-100 text-amber-900' : 'bg-stone-200 text-stone-800'}`}>
                                        {b.type === 'trial' ? '150₴' : '200₴'}
                                      </p>
                                    </div>
                                  </div>
                                )
                              })}
                            </div>
                            
                            {/* КНОПКА ОЧИЩЕННЯ БАЗИ ДАНИХ */}
                            <div className="mt-5 pt-4 border-t border-stone-200">
                              <button 
                                onClick={handleClearHistory}
                                className="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-xl text-xs font-bold uppercase tracking-wider transition-all"
                              >
                                ⚠️ Очистити всю історію
                              </button>
                              <p className="text-[9px] text-center text-stone-400 mt-2 leading-relaxed">
                                Увага: Ця дія повністю видалить всі минулі та майбутні записи з бази даних без можливості відновлення.
                              </p>
                            </div>
                          </div>

                        </div>
                      );
                    })()}

                  </div>
                )}
              </div>
            )}
          </main>

          {/* МОДАЛКИ (Перенос та Створення) */}
          
          {rescheduleModal && (
            <div className="fixed inset-0 bg-stone-950/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
              <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-stone-300">
                <div className="flex justify-between items-start mb-4 pb-2 border-b border-stone-200">
                  <div>
                    <h3 className="font-serif-title text-xl font-bold text-stone-900">Перенос записи</h3>
                    <p className="text-xs text-stone-600 mt-0.5">Оберіть нову дату для заняття:</p>
                  </div>
                  <button onClick={() => setRescheduleModal(null)} className="text-stone-400 font-bold">✕</button>
                </div>

                <div className="space-y-2.5 my-4">
                  {trainings.map(t => {
                    const freeSlots = t.maxCapacity - getBookedCount(t.id);
                    const isCurrent = t.id === rescheduleModal.currentTrainingId;
                    const canFit = freeSlots >= (rescheduleModal.booking.persons_count || 1);

                    return (
                      <button
                        key={t.id}
                        disabled={isCurrent || !canFit}
                        onClick={() => handleReschedule(t.id)}
                        className={`w-full p-3.5 rounded-xl border font-bold text-xs text-left flex justify-between items-center transition-all ${
                          isCurrent 
                            ? 'bg-stone-100 border-stone-200 text-stone-400 cursor-default' 
                            : !canFit 
                              ? 'bg-stone-50 border-stone-200 text-red-400 cursor-not-allowed'
                              : 'bg-white border-stone-300 text-stone-900 hover:bg-amber-50 hover:border-amber-300'
                        }`}
                      >
                        <div>
                          <span className="text-sm block">{t.day} ({t.time})</span>
                          <span className="text-[10px] font-normal text-stone-500">
                            {isCurrent ? 'Поточна дата' : `Вільних місць: ${freeSlots} • ${t.date}`}
                          </span>
                        </div>
                        {!isCurrent && canFit && <span className="text-amber-900">Обрати ➔</span>}
                      </button>
                    );
                  })}
                </div>

                <button 
                  onClick={() => setRescheduleModal(null)} 
                  className="w-full py-3 bg-stone-200 font-bold text-xs rounded-xl text-stone-800"
                >
                  Скасувати
                </button>
              </div>
            </div>
          )}

          {bookingModal && (() => {
            const freeSlots = bookingModal.training.maxCapacity - getBookedCount(bookingModal.training.id);
            const pricePerPerson = bookingModal.type === 'trial' ? 150 : 200;
            const totalPrice = pricePerPerson * personsCount;

            return (
              <div className="fixed inset-0 bg-stone-950/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
                <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-stone-300 max-h-[90vh] overflow-y-auto">
                  
                  <div className="flex justify-between items-start mb-5 pb-3 border-b border-stone-200">
                    <div>
                      <h3 className="font-serif-title text-2xl font-bold text-stone-900">
                        {bookingModal.type === 'trial' ? 'Пробне заняття' : 'Запис на йогу'}
                      </h3>
                      <p className="text-xs font-bold text-stone-500 uppercase tracking-wider mt-1">
                        {bookingModal.training.day} • {bookingModal.training.date}
                      </p>
                    </div>
                    <button 
                      onClick={() => { setBookingModal(null); setContactError(false); }} 
                      className="text-stone-500 hover:text-stone-900 bg-stone-100 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handleBooking} className="space-y-4">
                    
                    <div>
                      <label className="block text-xs font-bold text-stone-900 uppercase tracking-wider mb-1.5">
                        Кількість осіб
                      </label>
                      <div className="flex items-center gap-3 bg-stone-50 border-2 border-stone-200 rounded-xl p-2 justify-between">
                        <span className="text-sm font-bold text-stone-900 pl-2">
                          {personsCount} {personsCount === 1 ? 'особа' : personsCount < 5 ? 'особи' : 'осіб'}
                        </span>
                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            disabled={personsCount <= 1}
                            onClick={() => setPersonsCount(p => Math.max(1, p - 1))}
                            className="w-9 h-9 rounded-lg bg-stone-200 font-bold text-stone-800 hover:bg-stone-300 disabled:opacity-40 flex items-center justify-center text-lg"
                          >
                            -
                          </button>
                          <button
                            type="button"
                            disabled={personsCount >= freeSlots}
                            onClick={() => setPersonsCount(p => Math.min(freeSlots, p + 1))}
                            className="w-9 h-9 rounded-lg bg-stone-800 font-bold text-white hover:bg-stone-900 disabled:opacity-40 flex items-center justify-center text-lg"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-stone-900 uppercase tracking-wider mb-1.5">
                        {personsCount > 1 ? "Ім'я (основний контакт)" : "Як до вас звертатися?"}
                      </label>
                      <input
                        type="text" 
                        required 
                        placeholder="Ваше ім'я"
                        value={formData.name} 
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full bg-stone-50 border-2 border-stone-200 text-stone-900 font-semibold rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-stone-800 focus:bg-white placeholder-stone-400"
                      />
                    </div>

                    <div className="p-4 bg-stone-100 rounded-2xl border border-stone-300">
                      <p className="text-xs font-bold text-stone-900 mb-3 text-center">
                        Вкажіть хоча б один контакт для зв'язку:
                      </p>
                      
                      <div className="space-y-3">
                        <div>
                          <input
                            type="tel" 
                            placeholder="Телефон (напр. +380...)"
                            value={formData.phone} 
                            onChange={(e) => { setFormData({ ...formData, phone: e.target.value }); setContactError(false); }}
                            className={`w-full bg-white border-2 ${contactError ? 'border-red-500' : 'border-stone-300'} text-stone-900 font-semibold rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-stone-800 placeholder-stone-400`}
                          />
                        </div>

                        <div className="flex items-center gap-2 my-1">
                          <div className="w-full h-px bg-stone-300"></div>
                          <span className="text-[11px] font-extrabold uppercase text-stone-500 tracking-wider">АБО</span>
                          <div className="w-full h-px bg-stone-300"></div>
                        </div>

                        <div>
                          <input
                            type="text" 
                            placeholder="Instagram (нікнейм)"
                            value={formData.instagram} 
                            onChange={(e) => { setFormData({ ...formData, instagram: e.target.value }); setContactError(false); }}
                            className={`w-full bg-white border-2 ${contactError ? 'border-red-500' : 'border-stone-300'} text-stone-900 font-semibold rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-stone-800 placeholder-stone-400`}
                          />
                        </div>
                      </div>

                      {contactError && (
                        <p className="text-xs font-bold text-red-600 mt-2.5 text-center bg-red-50 p-2 rounded-lg border border-red-200">
                          ⚠️ Будь ласка, вкажіть телефон або Instagram!
                        </p>
                      )}
                    </div>

                    <div className="bg-amber-50/60 border-2 border-amber-200 rounded-2xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <span className="text-xl">🔔</span>
                          <div>
                            <p className="text-xs font-bold text-stone-900">Нагадати про заняття?</p>
                            <p className="text-[10px] font-medium text-stone-600">Надішлемо повідомлення перед початком</p>
                          </div>
                        </div>
                        <input
                          type="checkbox"
                          checked={formData.needReminder}
                          onChange={(e) => setFormData({ ...formData, needReminder: e.target.checked })}
                          className="w-5 h-5 accent-amber-900 rounded cursor-pointer"
                        />
                      </div>

                      {formData.needReminder && (
                        <div className="flex gap-2 pt-2 border-t border-amber-200/80">
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, reminderTime: '3h' })}
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${formData.reminderTime === '3h' ? 'bg-amber-900 text-white shadow-sm' : 'bg-white border border-amber-300 text-amber-950'}`}
                          >
                            За 3 години
                          </button>
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, reminderTime: '1d' })}
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${formData.reminderTime === '1d' ? 'bg-amber-900 text-white shadow-sm' : 'bg-white border border-amber-300 text-amber-950'}`}
                          >
                            За 1 день
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="pt-2">
                      <button 
                        type="submit" 
                        className="w-full py-4 rounded-xl font-bold text-xs uppercase tracking-widest text-white bg-stone-900 hover:bg-stone-950 active:scale-[0.99] shadow-lg shadow-stone-900/30 transition-all"
                      >
                        Підтвердити {bookingModal.type === 'trial' ? 'пробне' : 'запис'} ({totalPrice}₴)
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            );
          })()}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
